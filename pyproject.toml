[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcas-spear-current"
version = "0.1.0"
description = "Offline AV2 pair-line-graph robustness research: retained SPEAR-derived method"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["spear_current*"]

[project.scripts]
jcas-current-train = "spear_current.train:main"
jcas-current-evaluate = "spear_current.evaluate:main"
